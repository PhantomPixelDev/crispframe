<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{label}">
    <f:if condition="{pageUid}">
        <f:then><f:link.page pageUid="{pageUid}" class="{class}">{label}</f:link.page></f:then>
        <f:else>
            <f:if condition="{legacyLink} && {legacyLink} != '#' && {legacyLink} != '/'">
                <f:link.typolink parameter="{legacyLink}" class="{class}">{label}</f:link.typolink>
            </f:if>
        </f:else>
    </f:if>
</f:if>
</html>
