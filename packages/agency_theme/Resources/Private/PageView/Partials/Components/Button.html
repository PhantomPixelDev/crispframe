<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
  Partial: Components/Button
  Arguments:
    - label (string, required)   : Button text
    - href (string?)             : If given renders <a>; otherwise <button type="button">
    - variant (string?)          : "primary" | "secondary" | "ghost" (default "primary") -> maps to .btn--variant
    - target (string?)           : e.g. "_blank" (adds rel noopener)
    - size (string?)             : "sm" | "lg" (optional -> .btn--size)
    - type (string?)             : when rendering <button>, button type (default "button")
    - extraClass (string?)       : additional classes
    - ariaLabel (string?)        : aria-label override
    - icon (string?)             : icon name passed to Icon partial (optional trailing icon)
  Notes: prefers <a> for navigation; no inline onclick; semantic.
-->
<f:variable name="btnVariant">{f:if(condition: variant, then: variant, else: 'primary')}</f:variable>
<f:variable name="btnClass">btn btn--{btnVariant}{f:if(condition: size, then: ' btn--{size}')}{f:if(condition: extraClass, then: ' {extraClass}')}</f:variable>
<f:if condition="{href}">
    <f:then>
        <a href="{href}" class="{btnClass}"{f:if(condition: '{target} == _blank', then: ' target="_blank" rel="noopener noreferrer"')}{f:if(condition: 'target && target != _blank', then: ' target="{target}"')}{f:if(condition: ariaLabel, then: ' aria-label="{ariaLabel}"')}>{label}<f:if condition="{icon}"> <f:render partial="Components/Icon" arguments="{name: icon, decorative: 1, size: 16}" /></f:if></a>
    </f:then>
    <f:else>
        <button type="{f:if(condition: type, then: type, else: 'button')}" class="{btnClass}"{f:if(condition: ariaLabel, then: ' aria-label="{ariaLabel}"')}>{label}<f:if condition="{icon}"> <f:render partial="Components/Icon" arguments="{name: icon, decorative: 1, size: 16}" /></f:if></button>
    </f:else>
</f:if>
</html>
