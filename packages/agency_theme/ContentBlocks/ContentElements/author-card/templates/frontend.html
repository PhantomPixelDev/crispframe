<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{data.name}">
    <section class="section section--{data.sectionBackground}" data-spacing="{data.sectionSpacing}">
        <div class="container container--{data.width}">
            <div class="author-card">
                <f:for each="{data.portrait}" as="file"><f:image image="{file}" width="192c" height="192c" loading="lazy" decoding="async" alt="" class="author-card__portrait" /></f:for>
                <div class="author-card__content">
                    <h2 class="author-card__name">{data.name}</h2>
                    <f:if condition="{data.role}"><p class="author-card__role">{data.role}</p></f:if>
                    <f:if condition="{data.bio}"><p class="author-card__bio">{data.bio}</p></f:if>
                    <f:if condition="{data.link.url} && {data.linkLabel}"><f:link.typolink parameter="{data.link}" class="author-card__link">{data.linkLabel}<span aria-hidden="true"> →</span></f:link.typolink></f:if>
                </div>
            </div>
        </div>
    </section>
</f:if>
</html>
