<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Preview" />
<f:section name="Header">
    <strong>{data.headline -> f:format.stripTags() -> f:format.crop(maxCharacters: 160)}</strong>
</f:section>
<f:section name="Content">
    <f:if condition="{data.lead}"><p>{data.lead -> f:format.stripTags() -> f:format.crop(maxCharacters: 200)}</p></f:if>
    <f:if condition="{data.items}">
        <ul>
            <f:for each="{data.items}" as="item">
                <f:if condition="!{item.systemProperties.disabled}"><li>{item.name -> f:format.stripTags() -> f:format.crop(maxCharacters: 100)}</li></f:if>
            </f:for>
        </ul>
    </f:if>
</f:section>
</html>
