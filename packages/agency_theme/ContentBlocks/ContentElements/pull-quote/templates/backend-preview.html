<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Preview" />
<f:section name="Header">
    <strong>{data.quote -> f:format.stripTags() -> f:format.crop(maxCharacters: 160)}</strong>
</f:section>
<f:section name="Content">
    <f:if condition="{data.attribution}"><p>{data.attribution -> f:format.stripTags()}</p></f:if>
    <f:if condition="{data.role}"><p>{data.role -> f:format.stripTags()}</p></f:if>
</f:section>
</html>
