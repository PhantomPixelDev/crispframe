<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="learnMoreLabel" value="{f:translate(key: 'LLL:EXT:agency_theme/Resources/Private/Language/locallang.xlf:block.learnMore')}" />
<section class="section section--{data.sectionBackground}" data-spacing="{data.sectionSpacing}">
    <div class="container container--{data.width}">
        <header class="section-header section-header--center">
            <h2 class="section-header__title">{data.headline}</h2>
            <f:if condition="{data.lead}"><p class="section-header__lead">{data.lead}</p></f:if>
        </header>
        <f:if condition="{data.text}"><div class="prose prose--intro"><p>{data.text -> f:format.nl2br()}</p></div></f:if>
        <f:if condition="{data.link.url}">
            <p class="intro__action"><f:link.typolink parameter="{data.link}" class="btn btn--secondary">{f:if(condition: data.linkLabel, then: data.linkLabel, else: learnMoreLabel)}</f:link.typolink></p>
        </f:if>
    </div>
</section>
</html>
