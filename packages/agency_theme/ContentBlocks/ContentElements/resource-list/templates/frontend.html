<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{data.items}">
    <section class="section section--{data.sectionBackground}" data-spacing="{data.sectionSpacing}">
        <div class="container container--{data.width}">
            <header class="section-header">
                <h2 class="section-header__title">{data.headline}</h2>
                <f:if condition="{data.lead}"><p class="section-header__lead">{data.lead}</p></f:if>
            </header>
            <ul class="resource-list" role="list">
                <f:for each="{data.items}" as="item">
                    <f:if condition="{item.link.url}">
                        <li class="resource-list__item">
                            <f:link.typolink parameter="{item.link}" class="resource-list__link">
                                <f:if condition="{item.icon} != 'none'"><span class="resource-list__icon"><svg width="22" height="22" aria-hidden="true" focusable="false"><use href="{f:uri.resource(path: 'Icons/sprite.svg', extensionName: 'AgencyTheme')}#icon-{item.icon}" /></svg></span></f:if>
                                <span class="resource-list__content"><strong>{item.label}</strong><f:if condition="{item.description}"><span>{item.description}</span></f:if></span>
                                <span class="resource-list__arrow" aria-hidden="true">→</span>
                            </f:link.typolink>
                        </li>
                    </f:if>
                </f:for>
            </ul>
        </div>
    </section>
</f:if>
</html>
