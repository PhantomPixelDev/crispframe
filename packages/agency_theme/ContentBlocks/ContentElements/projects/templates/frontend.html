<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:variable name="viewProjectLabel" value="{f:translate(key: 'LLL:EXT:agency_theme/Resources/Private/Language/locallang.xlf:block.viewProject')}" />
<section class="section section--{data.sectionBackground}" data-spacing="{data.sectionSpacing}">
    <div class="container container--{data.width}">
        <header class="section-header">
            <h2 class="section-header__title">{data.headline}</h2>
            <f:if condition="{data.lead}"><p class="section-header__lead">{data.lead}</p></f:if>
        </header>
        <f:if condition="{data.items}">
            <ul class="cards cards--projects" role="list">
                <f:for each="{data.items}" as="item">
                    <li class="card project-card">
                        <f:if condition="{item.image}">
                            <div class="project-card__media">
                                <f:for each="{item.image}" as="file">
                                    <f:image image="{file}" width="640c" height="420c" loading="lazy" decoding="async" alt="{f:if(condition: file.alternative, then: file.alternative, else: item.title)}" class="project-card__image" />
                                </f:for>
                            </div>
                        </f:if>
                        <div class="project-card__body">
                            <f:if condition="{item.category}"><p class="project-card__category">{item.category}</p></f:if>
                            <h3 class="card__title">{item.title}</h3>
                            <f:if condition="{item.description}"><p class="card__text">{item.description}</p></f:if>
                            <f:if condition="{item.link.url}"><p class="card__action"><f:link.typolink parameter="{item.link}" class="btn btn--secondary">{f:if(condition: item.linkLabel, then: item.linkLabel, else: viewProjectLabel)}</f:link.typolink></p></f:if>
                        </div>
                    </li>
                </f:for>
            </ul>
        </f:if>
    </div>
</section>
</html>
