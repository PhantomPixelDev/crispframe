name: Release checks
on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer validate --strict packages/agency_theme/composer.json
      - run: composer validate --strict packages/agency_demo/composer.json
      - run: composer validate --strict starter/composer.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php scripts/check-static.php
      - run: find packages/agency_theme/Resources/Public/JavaScript -name '*.js' -print0 | xargs -0 -n1 node --check

  clean-install-and-browser:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: command -v npx
      - run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - run: CRISPFRAME_BROWSER_SMOKE=1 CRISPFRAME_TEST_SMTP=127.0.0.1:1025 CRISPFRAME_MAILPIT_API=http://127.0.0.1:8025/api/v1/messages sh scripts/clean-install.sh
